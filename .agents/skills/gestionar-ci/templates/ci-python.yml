# Plantilla minima de CI para proyectos Python.
# Punto de partida: adapta versiones, gestor de dependencias y matriz a tu realidad concreta.
# Doc oficial: https://github.com/actions/setup-python
# Versiones estables a jun-2026: actions/checkout@v7, setup-python@v6.
# Nota: setup-python@v6 requiere Actions Runner >= 2.327.1 (Node 24 runtime).
name: ci-python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'   # leer de .python-version si existe
          cache: 'pip'             # cambiar a 'uv' o 'poetry' segun el lockfile

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Lint
        run: ruff check .   # cambiar a 'flake8' o 'pylint' segun el proyecto

      - name: Test
        run: pytest --cov=. --cov-report=xml